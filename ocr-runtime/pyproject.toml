[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dahe-ocr-worker"
version = "0.6.4"
description = "Isolated local OCR worker for DaHe Logistics"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
dahe-ocr-worker = "dahe_ocr_worker.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
